# Retargeting config for the Unitree SharpaWave dexterous hand (22 DOF / hand)
# URDF source: ~/Projects/sharpa-urdf-usd-xml/wave_01/{left,right}_sharpa_wave/*_with_flange.urdf
# `with_flange` variant chosen so the hand mounts at the H2 wrist flange (no extra wrist DOF).
# Fingertip frames used for IK targets: `{side}_{finger}_fingertip` (per Sharpa README).

left:
  type: DexPilot
  urdf_path: unitree_hand/sharpa_urdf/left_sharpa_wave/left_sharpa_wave_with_flange.urdf

  target_joint_names:
    [
      "left_thumb_CMC_FE",  "left_thumb_CMC_AA",  "left_thumb_MCP_FE",  "left_thumb_MCP_AA",  "left_thumb_IP",
      "left_index_MCP_FE",  "left_index_MCP_AA",  "left_index_PIP",     "left_index_DIP",
      "left_middle_MCP_FE", "left_middle_MCP_AA", "left_middle_PIP",    "left_middle_DIP",
      "left_ring_MCP_FE",   "left_ring_MCP_AA",   "left_ring_PIP",      "left_ring_DIP",
      "left_pinky_CMC",     "left_pinky_MCP_FE",  "left_pinky_MCP_AA",  "left_pinky_PIP",   "left_pinky_DIP",
    ]

  wrist_link_name: "left_hand_flange"
  finger_tip_link_names:
    [ "left_thumb_fingertip", "left_index_fingertip", "left_middle_fingertip", "left_ring_fingertip", "left_pinky_fingertip" ]
  # Map XR 25-keypoint hand skeleton tip indices (4=thumb,9=index,14=middle,19=ring,24=pinky)
  # to fingertip pairs used by DexPilot's contact graph.
  target_link_human_indices_dexpilot: [[ 9, 14, 19, 24, 14, 19, 24, 19, 24, 24, 0, 0, 0, 0, 0],
                                       [ 4,  4,  4,  4,  9,  9,  9, 14, 14, 19, 4, 9,14,19,24]]

  scaling_factor: 1.0
  low_pass_alpha: 0.2

right:
  type: DexPilot
  urdf_path: unitree_hand/sharpa_urdf/right_sharpa_wave/right_sharpa_wave_with_flange.urdf

  target_joint_names:
    [
      "right_thumb_CMC_FE",  "right_thumb_CMC_AA",  "right_thumb_MCP_FE",  "right_thumb_MCP_AA",  "right_thumb_IP",
      "right_index_MCP_FE",  "right_index_MCP_AA",  "right_index_PIP",     "right_index_DIP",
      "right_middle_MCP_FE", "right_middle_MCP_AA", "right_middle_PIP",    "right_middle_DIP",
      "right_ring_MCP_FE",   "right_ring_MCP_AA",   "right_ring_PIP",      "right_ring_DIP",
      "right_pinky_CMC",     "right_pinky_MCP_FE",  "right_pinky_MCP_AA",  "right_pinky_PIP",   "right_pinky_DIP",
    ]

  wrist_link_name: "right_hand_flange"
  finger_tip_link_names:
    [ "right_thumb_fingertip", "right_index_fingertip", "right_middle_fingertip", "right_ring_fingertip", "right_pinky_fingertip" ]
  target_link_human_indices_dexpilot: [[ 9, 14, 19, 24, 14, 19, 24, 19, 24, 24, 0, 0, 0, 0, 0],
                                       [ 4,  4,  4,  4,  9,  9,  9, 14, 14, 19, 4, 9,14,19,24]]

  scaling_factor: 1.0
  low_pass_alpha: 0.2
